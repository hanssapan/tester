<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIAKAD - Halaman Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --c-bg: #0a0c1c;             /* Background: Deep space blue */
            --c-surface: #1c1e33;        /* Warna Kartu: Blue-grey */
            --c-border: #3a3f77;         /* Warna Border */
            --c-text-primary: #e1e1e1;   /* Teks Utama: Off-white */
            --c-text-secondary: #8b949e; /* Teks Sekunder/Placeholder */
            --c-accent-start: #9f55ff;   /* Aksen Ungu Elektrik */
            --c-accent-end: #ff4b7b;     /* Aksen Pink/Magenta */
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--c-bg);
            color: var(--c-text-primary);
        }

        .card {
            background-color: var(--c-surface);
            border: 1px solid var(--c-border);
            border-radius: 0.75rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .form-control, .input-group-text {
            background-color: var(--c-bg);
            border-color: var(--c-border);
            color: var(--c-text-primary);
        }
        .form-control:focus {
            background-color: var(--c-bg);
            border-color: var(--c-accent-start);
            color: var(--c-text-primary);
            box-shadow: 0 0 0 0.25rem rgba(159, 85, 255, 0.25);
        }
        .form-control::placeholder {
            color: var(--c-text-secondary);
        }
        .input-group-text {
            color: var(--c-text-secondary);
        }

        .btn-gradient-accent {
            background-image: linear-gradient(to right, var(--c-accent-start) 0%, var(--c-accent-end) 100%);
            border: none;
            color: white;
            font-weight: 600;
            transition: transform 0.2s ease-out, box-shadow 0.2s ease;
        }
        .btn-gradient-accent:hover {
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 8px 15px rgba(159, 85, 255, 0.3);
        }
    </style>
</head>
<body>
    <div class="container vh-100 d-flex flex-column justify-content-center align-items-center">
        <main class="w-100" style="max-width: 400px;">
            <div class="card p-4">
                <div class="card-body">
                    <div class="text-center mb-4">
                        <img src="logo.jpg" alt="Logo Kampus" class="rounded-circle mb-3 border border-2" style="border-color: var(--c-border) !important;">
                        <h3 class="fw-bold" style="color: #9f55ff;">SIAKAD UNITAMA</h3>
                        <p style="color: var(--c-text-secondary);">Sistem Informasi Manajemen Akademik</p>
                    </div>

                    <form>
                        <div class="mb-3 input-group">
                            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                            <input type="email" class="form-control" placeholder="Alamat Email">
                        </div>
                        <div class="mb-4 input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control" placeholder="Kata Sandi">
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-gradient-accent p-2">
                                <i class="bi bi-box-arrow-in-right"></i> LOGIN
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
        
        <footer class="mt-5 text-center" style="color: var(--c-text-secondary);">
            <small>&copy; Biro Inovasi Teknologi & Sistem Informasi Unitama : 2017 - 2025</small>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
